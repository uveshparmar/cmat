<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CMAT Practice Lab</title>
<style>
:root{--bg:#f4f7fc;--card:#fff;--ink:#172033;--muted:#64748b;--primary:#3157d5;--line:#e2e8f0;--good:#e9f9ef;--bad:#fff0f0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,Arial,sans-serif}
header{background:#172554;color:#fff;padding:22px 16px}header .wrap,main{max-width:1050px;margin:auto}.brand{font-size:24px;font-weight:800}.sub{color:#dbeafe;font-size:14px}
main{padding:24px 16px 50px}.hero{background:linear-gradient(120deg,#e1eaff,#f8faff);border:1px solid #dce6ff;border-radius:18px;padding:22px;margin-bottom:24px}
h1{font-size:clamp(24px,4vw,34px);line-height:1.2;margin:6px 0 10px}h2{font-size:21px;margin:26px 0 12px}p{margin:8px 0}.muted{color:var(--muted)}.tag{display:inline-block;background:#e9edff;color:#2c439d;border-radius:30px;padding:4px 10px;font-size:12px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:0 3px 12px #17255408}.card h3{margin:8px 0 4px;font-size:18px}
button,.btn{border:0;border-radius:10px;background:var(--primary);color:white;font-weight:750;padding:11px 15px;font-size:15px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px}
button:hover,.btn:hover{filter:brightness(.95)}.secondary{background:#e9edff;color:#293e9b}.outline{background:#fff;color:#263b91;border:1px solid #cdd7ff}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.question{margin-bottom:14px}.qmeta{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}.qtext{font-size:17px;font-weight:750;margin:8px 0 14px}
.option{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin:8px 0;background:#fff;cursor:pointer}.option:hover{border-color:#a5b4fc}.option input{margin-top:5px}.solution{margin-top:12px;padding:13px;background:#f8fafc;border:1px solid var(--line);border-radius:10px}.correct{background:var(--good);border-color:#b7e5c5}.incorrect{background:var(--bad);border-color:#f1b9b9}.score{font-size:34px;font-weight:850;color:var(--primary)}.progress{height:8px;background:#e2e8f0;border-radius:20px;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;background:var(--primary)}.notice{font-size:13px;color:var(--muted)}.exambar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#172554;color:#fff;padding:12px 16px;border-radius:12px;margin:0 0 16px;box-shadow:0 5px 18px #17255422}.exambar .timer{font-size:22px;font-weight:850;font-variant-numeric:tabular-nums;letter-spacing:.5px}.exambar .timer.warning{color:#fecaca}.exambar .exam-note{font-size:13px;color:#dbeafe}.exambar .answered-count{font-size:13px;color:#dbeafe}footer{text-align:center;padding:20px;color:var(--muted);font-size:13px}
@media(max-width:600px){main{padding:16px 12px 35px}.hero{padding:18px}.card{padding:15px}.option{padding:10px}}
</style>
</head>
<body>
<header><div class="wrap"><div class="brand">🎓 CMAT Practice Lab</div><div class="sub">CMAT-style topic practice · full 100-question mock · timed exam · solutions after submission</div></div></header>
<main id="app"></main>
<footer>CMAT Practice Lab · Single-file HTML · No login, installation, server or database required</footer>
<script>
const topics = [
 {id:'percentages',section:'Quantitative Techniques & Data Interpretation',name:'Percentages',desc:'Percentage of a number, increase and decrease.'},
 {id:'ratio',section:'Quantitative Techniques & Data Interpretation',name:'Ratio & Proportion',desc:'Ratios, sharing amounts and proportions.'},
 {id:'averages',section:'Quantitative Techniques & Data Interpretation',name:'Averages',desc:'Mean, totals and missing values.'},
 {id:'profit',section:'Quantitative Techniques & Data Interpretation',name:'Profit & Loss',desc:'Cost price, selling price, profit and discount.'},
 {id:'interest',section:'Quantitative Techniques & Data Interpretation',name:'Simple Interest',desc:'Principal, rate, time and interest.'},
 {id:'work',section:'Quantitative Techniques & Data Interpretation',name:'Time & Work',desc:'Work rates and fractions of work.'},
 {id:'series',section:'Logical Reasoning',name:'Number Series',desc:'Find patterns and the next number.'},
 {id:'alphabet',section:'Logical Reasoning',name:'Alphabet Series',desc:'Letter positions and patterns.'},
 {id:'coding',section:'Logical Reasoning',name:'Coding-Decoding',desc:'Letter shifts and simple codes.'},
 {id:'directions',section:'Logical Reasoning',name:'Direction Sense',desc:'Track movement and final direction.'},
 {id:'blood',section:'Logical Reasoning',name:'Blood Relations',desc:'Understand family relationships.'},
 {id:'grammar',section:'Language Comprehension',name:'English Grammar',desc:'Choose grammatically correct sentences.'},
 {id:'vocab',section:'Language Comprehension',name:'Vocabulary',desc:'Synonyms and antonyms.'},
 {id:'gk',section:'General Awareness',name:'General Awareness',desc:'Static general knowledge practice.'},
 {id:'entrepreneur',section:'Innovation & Entrepreneurship',name:'Innovation & Entrepreneurship',desc:'Startups, business concepts and innovation.'}
];
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=n=>Number.isInteger(n)?String(n):String(Math.round(n*100)/100);
function mcq(type,question,options,answer,explanation){const correct=options[answer];const opts=shuffle(options);return {type,question,options:opts,answer:opts.indexOf(correct),explanation}}
function makeQuestion(topic){
 let a,b,n,p,ans,opts,vals,word,coded;
 switch(topic){
 case 'percentages':
  n=pick([120,150,200,240,250,300,360,400,500,600]);p=pick([5,10,15,20,25,30,40,50]);ans=n*p/100;
  return mcq('Percentage',`What is ${p}% of ${n}?`,[ans,ans+10,Math.max(0,ans-5),ans+20].map(fmt),0,`Percentage amount = number × percentage ÷ 100 = ${n} × ${p} ÷ 100 = ${fmt(ans)}.`);
 case 'ratio':
  a=rand(2,5);b=rand(2,6);n=rand(3,8);ans=a*n;
  return mcq('Ratio',`The ratio of A to B is ${a}:${b}. If A + B = ${(a+b)*n}, what is A?`,[ans,ans+n,b*n,(a+b)*n-n].map(String),0,`Total parts = ${a}+${b}=${a+b}. One part = ${(a+b)*n} ÷ ${a+b} = ${n}. A = ${a} × ${n} = ${ans}.`);
 case 'averages':
  n=rand(3,6);vals=Array.from({length:n-1},()=>rand(10,35));ans=rand(18,35);vals.push(ans*n-vals.reduce((x,y)=>x+y,0));
  return mcq('Average',`Find the average of ${vals.join(', ')}.`,[ans,ans+2,ans-2,ans+5].map(String),0,`Add the values to get ${vals.reduce((x,y)=>x+y,0)}. Divide by ${n}: ${vals.reduce((x,y)=>x+y,0)} ÷ ${n} = ${ans}.`);
 case 'profit':
  a=rand(4,20)*50;p=pick([10,15,20,25,30,40]);b=a*(100+p)/100;
  return mcq('Profit & Loss',`An item costs ₹${a} and is sold for ₹${b}. What is the profit percentage?`,[p,p+5,p-5,p*2].map(x=>x+'%'),0,`Profit = ₹${b-a}. Profit % = (profit ÷ cost price) × 100 = (${b-a} ÷ ${a}) × 100 = ${p}%.`);
 case 'interest':
  a=rand(5,30)*100;p=pick([4,5,6,8,10]);n=rand(1,4);ans=a*p*n/100;
  return mcq('Simple Interest',`Find the simple interest on ₹${a} at ${p}% per year for ${n} year(s).`,[ans,ans+50,Math.max(0,ans-50),ans*2].map(x=>'₹'+fmt(x)),0,`SI = Principal × Rate × Time ÷ 100 = ${a} × ${p} × ${n} ÷ 100 = ₹${fmt(ans)}.`);
 case 'work':
  a=rand(4,15);b=rand(1,a-1);let g=(x,y)=>y?g(y,x%y):x;let num=b/g(a,b),den=a/g(a,b);ans=`${num}/${den}`;
  return mcq('Time & Work',`A person completes a job in ${a} days at a constant rate. What fraction is completed in ${b} day(s)?`,[ans,`${b+1}/${a}`,`${b}/${a+1}`,`1/${a}`],0,`One day's work = 1/${a}. In ${b} days, work = ${b}/${a}, simplified to ${ans}.`);
 case 'series':
  a=rand(2,15);b=rand(2,9);vals=Array.from({length:5},(_,i)=>a+i*b);ans=a+5*b;
  return mcq('Number Series',`Find the next number: ${vals.join(', ')}, ?`,[ans,ans+b,ans-1,ans+2].map(String),0,`The sequence increases by ${b} each time. Next number = ${vals[4]} + ${b} = ${ans}.`);
 case 'alphabet':
  a=rand(1,8);b=pick([2,3,4]);vals=Array.from({length:4},(_,i)=>String.fromCharCode(65+a-1+i*b));ans=String.fromCharCode(65+a-1+4*b);
  return mcq('Alphabet Series',`Which letter comes next: ${vals.join(', ')}, ?`,[ans,String.fromCharCode(ans.charCodeAt(0)+1),String.fromCharCode(ans.charCodeAt(0)-1),vals[3]],0,`Move forward ${b} letters each time. After ${vals[3]} comes ${ans}.`);
 case 'coding':
  word=pick(['CAT','DOG','PEN','MAP','SUN','BOX','CUP','HAT','BUS','JAM']);coded=[...word].map(c=>String.fromCharCode(c.charCodeAt(0)+1)).join('');
  return mcq('Coding-Decoding',`If every letter is replaced by the next letter in the alphabet, how is ${word} coded?`,[coded,coded.slice(1)+coded[0],[...coded].reverse().join(''),word],0,`Move each letter forward one place: ${[...word].join(' → ')} becomes ${[...coded].join(' → ')}. The code is ${coded}.`);
 case 'directions':
  a=rand(4,12);b=rand(1,a-1);
  return mcq('Direction Sense',`A person walks ${a} metres north and then ${b} metres south. Where are they relative to the starting point?`,[`North, ${a-b} metres`,`South, ${b} metres`,`East, ${a-b} metres`,`At the starting point`],0,`Northward distance ${a} m minus southward distance ${b} m leaves ${a-b} m north of the start.`);
 case 'blood':
  return pick([
   mcq('Blood Relations','A is the brother of B. B is the sister of C. How is A related to C?',['Brother','Father','Uncle','Cousin'],0,'A and C are siblings; A is C’s brother.'),
   mcq('Blood Relations','Rina is the mother of Karan. Karan is the father of Meena. How is Rina related to Meena?',['Grandmother','Aunt','Sister','Mother'],0,'Rina is Karan’s mother, and Karan is Meena’s father. Rina is Meena’s grandmother.'),
   mcq('Blood Relations','Jay is the son of Pooja. Pooja is the daughter of Amit. How is Amit related to Jay?',['Grandfather','Brother','Uncle','Father'],0,'Amit is Pooja’s father, so he is Jay’s grandfather.'),
   mcq('Blood Relations','Neha is Ravi’s sister. Kiran is Ravi’s mother. How is Kiran related to Neha?',['Mother','Cousin','Sister','Grandmother'],0,'Ravi and Neha are siblings; Kiran is Ravi’s mother, so she is Neha’s mother too.'),
   mcq('Blood Relations','M is the father of N. N is the sister of P. How is M related to P?',['Father','Uncle','Brother','Cousin'],0,'N and P are siblings. M is N’s father, so M is P’s father.')
  ]);
 case 'grammar':
  return pick([
   mcq('Grammar','Choose the correct sentence.',['She goes to work every day.','She go to work every day.','She going to work every day.','She gone to work every day.'],0,'With “she” in the simple present tense, use “goes.”'),
   mcq('Grammar','Choose the correct sentence.',['They have finished their work.','They has finished their work.','They is finished their work.','They was finish their work.'],0,'Use “have” with “they” and the past participle “finished.”'),
   mcq('Grammar','Choose the correct word: He is ___ honest person.',['an','a','the','no article'],0,'“Honest” begins with a vowel sound, so use “an.”'),
   mcq('Grammar','Choose the correct sentence.',['I have lived here for two years.','I am live here for two years.','I lives here for two years.','I living here for two years.'],0,'The present perfect describes a situation continuing to the present.'),
   mcq('Grammar','Neither of the answers ___ correct.',['is','are','were','be'],0,'“Neither” is singular in this sentence, so use “is.”')
  ]);
 case 'vocab':
  return pick([
   mcq('Vocabulary','Choose the synonym of “rapid”.',['Fast','Quiet','Weak','Late'],0,'“Rapid” means fast or quick.'),
   mcq('Vocabulary','Choose the antonym of “ancient”.',['Modern','Old','Historic','Past'],0,'“Modern” is the opposite of “ancient.”'),
   mcq('Vocabulary','Choose the synonym of “assist”.',['Help','Stop','Hide','Refuse'],0,'“Assist” means to help.'),
   mcq('Vocabulary','Choose the antonym of “expand”.',['Contract','Increase','Enlarge','Extend'],0,'“Contract” means to become smaller; it is the opposite of “expand.”'),
   mcq('Vocabulary','Choose the synonym of “accurate”.',['Correct','Careless','Unclear','Slow'],0,'“Accurate” means correct or precise.')
  ]);
 case 'gk':
  return pick([
   mcq('General Awareness','Which organisation conducts the CMAT examination?',['National Testing Agency (NTA)','UPSC','RBI','SSC'],0,'The National Testing Agency conducts CMAT.'),
   mcq('General Awareness','What is the capital of Gujarat?',['Gandhinagar','Ahmedabad','Surat','Rajkot'],0,'Gandhinagar is the capital of Gujarat.'),
   mcq('General Awareness','Which is the central bank of India?',['Reserve Bank of India','State Bank of India','NABARD','SEBI'],0,'The Reserve Bank of India is India’s central bank.'),
   mcq('General Awareness','Which planet is known as the Red Planet?',['Mars','Venus','Jupiter','Mercury'],0,'Mars is called the Red Planet because of its reddish appearance.'),
   mcq('General Awareness','What does GST stand for in India?',['Goods and Services Tax','General Sales Tariff','Government Service Tax','Goods Supply Trade'],0,'GST stands for Goods and Services Tax.')
  ]);
 case 'entrepreneur':
  return pick([
   mcq('Entrepreneurship','What is a Minimum Viable Product (MVP)?',['A basic product version used to test an idea','A company’s annual profit','A final product with every feature','A marketing budget'],0,'An MVP is an early basic version used to test assumptions and gather feedback.'),
   mcq('Entrepreneurship','What is a business model?',['How a business creates and earns value','A company logo','An attendance sheet','A tax receipt'],0,'A business model explains how a business creates, delivers and captures value.'),
   mcq('Entrepreneurship','What does bootstrapping a startup usually mean?',['Building it using personal funds or early revenue','Listing shares on a stock exchange','Buying a competitor','Hiring only interns'],0,'Bootstrapping relies on personal funds and/or business revenue instead of outside investment.'),
   mcq('Entrepreneurship','What is intellectual property?',['Creations of the mind protected by law','Office furniture','A monthly salary','A sales target'],0,'Intellectual property includes creations such as inventions, designs and original works.'),
   mcq('Entrepreneurship','What is market research used for?',['Understanding customers and market demand','Choosing a random company name','Avoiding customer feedback','Calculating employee holidays'],0,'Market research helps assess customer needs, competitors and demand.')
  ]);
 }
}

/* Original CMAT-style question bank informed by published 2024–2025 paper analyses.
   These are newly written practice questions, not copied official-paper questions. */
const curatedQuestions = [
 // Quantitative Techniques & Data Interpretation (15)
 ['Quantitative Techniques & Data Interpretation','percentages','Percentages','A price rises from ₹800 to ₹920. What is the percentage increase?',['12%','15%','18%','20%'],1,'Increase = 920 − 800 = 120. Percentage increase = 120/800 × 100 = 15%.'],
 ['Quantitative Techniques & Data Interpretation','ratio','Ratio & Proportion','The ratio of boys to girls is 7:5. If there are 144 students, how many are girls?',['50','60','72','84'],1,'Total parts = 12. One part = 144/12 = 12; girls = 5 × 12 = 60.'],
 ['Quantitative Techniques & Data Interpretation','profit','Profit & Loss','An article marked at ₹2,000 is sold at a 10% discount. If its cost price is ₹1,500, what is the profit percentage?',['10%','15%','20%','25%'],2,'Selling price = ₹1,800. Profit = ₹300; profit percentage = 300/1,500 × 100 = 20%.'],
 ['Quantitative Techniques & Data Interpretation','interest','Simple & Compound Interest','Find the simple interest on ₹6,000 at 7.5% per annum for 2 years.',['₹750','₹800','₹900','₹1,000'],2,'SI = PRT/100 = 6,000 × 7.5 × 2/100 = ₹900.'],
 ['Quantitative Techniques & Data Interpretation','work','Time & Work','A can finish a task in 12 days and B in 18 days. How long will they take together?',['6 days','7.2 days','8 days','9 days'],1,'Combined rate = 1/12 + 1/18 = 5/36 task/day. Time = 36/5 = 7.2 days.'],
 ['Quantitative Techniques & Data Interpretation','averages','Averages','The average of 8 numbers is 17. If one number, 24, is removed, what is the average of the remaining numbers?',['15','16','16','17'],1,'Original total = 8 × 17 = 136. Remaining total = 112; 112/7 = 16.'],
 ['Quantitative Techniques & Data Interpretation','percentages','Mixtures','A 30-litre mixture contains milk and water in the ratio 4:1. How much water must be added to make the ratio 2:1?',['3 litres','5 litres','6 litres','8 litres'],2,'Milk = 24 L and water = 6 L. For 24:water = 2:1, water must be 12 L; add 6 L.'],
 ['Quantitative Techniques & Data Interpretation','ratio','Time, Speed & Distance','A car travels 180 km in 3 hours. At the same speed, how far will it travel in 4.5 hours?',['240 km','250 km','270 km','300 km'],2,'Speed = 180/3 = 60 km/h. Distance = 60 × 4.5 = 270 km.'],
 ['Quantitative Techniques & Data Interpretation','averages','Algebra','If 3x − 7 = 20, what is x?',['7','8','9','10'],2,'3x = 27, so x = 9.'],
 ['Quantitative Techniques & Data Interpretation','averages','Number System','What is the least number that must be added to 563 to make it divisible by 9?',['1','2','3','4'],3,'563 has remainder 5 when divided by 9, so add 4 to reach 567.'],
 ['Quantitative Techniques & Data Interpretation','percentages','Probability','A fair die is rolled once. What is the probability of getting a number greater than 4?',['1/6','1/3','1/2','2/3'],1,'Favourable outcomes are 5 and 6: 2/6 = 1/3.'],
 ['Quantitative Techniques & Data Interpretation','ratio','Permutation & Combination','How many different arrangements can be made using all letters of the word CAT?',['3','4','6','9'],2,'All three letters are distinct, so arrangements = 3! = 6.'],
 ['Quantitative Techniques & Data Interpretation','averages','Geometry & Mensuration','The length and breadth of a rectangle are 12 cm and 7 cm. What is its perimeter?',['19 cm','38 cm','42 cm','84 cm'],1,'Perimeter = 2(l + b) = 2(12 + 7) = 38 cm.'],
 ['Quantitative Techniques & Data Interpretation','percentages','Data Interpretation','A shop sold 120, 150 and 180 units in January, February and March. What was the average monthly sale?',['140','150','160','170'],1,'Total = 450 units. Average = 450/3 = 150.'],
 ['Quantitative Techniques & Data Interpretation','interest','Compound Interest','₹10,000 is invested at 10% compound interest annually for 2 years. What is the amount?',['₹11,000','₹12,000','₹12,100','₹12,200'],2,'Amount = 10,000 × 1.1² = ₹12,100.'],

 // Logical Reasoning (15)
 ['Logical Reasoning','series','Number Series','Find the next term: 3, 8, 15, 24, 35, __.',['44','46','48','50'],2,'Differences are 5, 7, 9, 11; next difference is 13, so 35 + 13 = 48.'],
 ['Logical Reasoning','alphabet','Alphabet Series','Find the next letter: B, E, I, N, T, __.',['A','Z','B','C'],0,'Letter jumps are +3, +4, +5, +6; next is +7. T + 7 wraps to A.'],
 ['Logical Reasoning','coding','Coding-Decoding','If TABLE is coded as UBCMF by shifting each letter one step forward, how is CHAIR coded?',['DIBJS','DIBIR','BGZHQ','DHBJS'],0,'Shift each letter forward by one: C→D, H→I, A→B, I→J, R→S.'],
 ['Logical Reasoning','directions','Direction Sense','A person walks 5 km east, turns left and walks 3 km, then turns left and walks 5 km. Where are they from the start?',['3 km north','3 km south','5 km east','At the start'],0,'The east and west legs cancel; the person is 3 km north of the starting point.'],
 ['Logical Reasoning','blood','Blood Relations','Pointing to a woman, Arun says, “She is the daughter of my mother’s only son.” How is the woman related to Arun?',['Sister','Daughter','Niece','Mother'],1,'Arun is his mother’s only son; his daughter is the woman described.'],
 ['Logical Reasoning','series','Analogy','Book is to Reading as Fork is to __.',['Drawing','Eating','Writing','Cutting'],1,'A book is used for reading; a fork is used for eating.'],
 ['Logical Reasoning','coding','Odd One Out','Choose the odd one out.',['Square','Triangle','Circle','Cube'],3,'Cube is three-dimensional; the others are two-dimensional shapes.'],
 ['Logical Reasoning','blood','Syllogism','Statements: All roses are flowers. Some flowers fade quickly. Conclusion: Some roses fade quickly.',['Definitely follows','Definitely does not follow','Cannot be determined','Both statements are false'],2,'The flowers that fade quickly may or may not be roses, so the conclusion is not certain.'],
 ['Logical Reasoning','directions','Seating Arrangement','P, Q and R sit in a row. Q is between P and R. If P is at the left end, who is at the right end?',['P','Q','R','Cannot be determined'],2,'With P at the left and Q between P and R, the order is P–Q–R.'],
 ['Logical Reasoning','series','Clock Reasoning','What is the angle between the hands of a clock at 3:00?',['45°','60°','90°','120°'],2,'At 3:00 the minute hand is at 12 and hour hand at 3: angle = 90°.'],
 ['Logical Reasoning','coding','Statement & Conclusion','Statement: All applicants must submit a photograph. Mira is an applicant. Conclusion: Mira must submit a photograph.',['Follows','Does not follow','Only if Mira asks','Cannot be determined'],0,'The rule applies to every applicant, including Mira.'],
 ['Logical Reasoning','directions','Calendar','If today is Wednesday, what day will it be 10 days later?',['Friday','Saturday','Sunday','Monday'],1,'Ten days later is 7 + 3 days later than Wednesday, which is Saturday.'],
 ['Logical Reasoning','series','Number Puzzle','If 4 workers make 4 chairs in 4 days, how many days will 8 workers take to make 8 chairs at the same rate?',['2','4','8','16'],1,'Each worker makes one chair in 4 days; 8 workers can make 8 chairs in 4 days.'],
 ['Logical Reasoning','coding','Venn Diagram','Which relationship best represents sparrows, birds and animals?',['All separate','Sparrows inside birds, birds inside animals','Birds inside sparrows','Animals inside birds'],1,'Sparrows are birds, and birds are animals: nested sets.'],
 ['Logical Reasoning','blood','Assumption','A company introduces a bus service for employees to reduce late arrivals. Which assumption is most relevant?',['Some late arrivals are caused by commuting difficulties','All employees dislike buses','The company will close its office','Employees never travel by car'],0,'The plan assumes commuting is one cause of lateness and that a bus service can help.'],

 // Language Comprehension (15)
 ['Language Comprehension','grammar','Grammar','Choose the grammatically correct sentence.',['Each of the players have a kit.','Each of the players has a kit.','Each players has a kit.','Each player have a kit.'],1,'“Each” is singular, so it takes “has.”'],
 ['Language Comprehension','vocab','Vocabulary','Choose the closest synonym of “mitigate”.',['Worsen','Reduce','Ignore','Predict'],1,'Mitigate means to make something less severe or harmful.'],
 ['Language Comprehension','vocab','Vocabulary','Choose the antonym of “scarce”.',['Rare','Limited','Abundant','Insufficient'],2,'Abundant means plentiful, the opposite of scarce.'],
 ['Language Comprehension','grammar','Fill in the Blank','Despite ___ hard, he did not pass the test.',['work','worked','working','to working'],2,'“Despite” is followed by a noun or gerund: “working hard.”'],
 ['Language Comprehension','grammar','Active and Passive Voice','Choose the correct passive form: “The manager approved the proposal.”',['The proposal approved the manager.','The proposal was approved by the manager.','The proposal is approving the manager.','The manager was approved by the proposal.'],1,'Past simple active changes to “was/were + past participle” in passive voice.'],
 ['Language Comprehension','grammar','Sentence Correction','Choose the correct sentence.',['Neither Riya nor her friends was present.','Neither Riya nor her friends were present.','Neither Riya or her friends were present.','Neither Riya nor her friends is present yesterday.'],1,'With “neither…nor,” the verb commonly agrees with the nearer subject; “friends” is plural.'],

function makeBankQuestion(row){
 const base=mcq(row[2],row[3],row[4],row[5],row[6]);
 return {...base,section:row[0],topicId:row[1]};
}
function getPracticeQuestions(id,count){
 const curated=shuffle(curatedQuestions.filter(row=>row[1]===id)).map(makeBankQuestion);
 const generated=[];
 while(curated.length+generated.length<count){
  const q=makeQuestion(id);
  if(q)generated.push(q);
  else break;
 }
 const combined=shuffle([...curated,...generated]);
 while(combined.length<count && curated.length){combined.push(makeBankQuestion(pick(curatedQuestions.filter(row=>row[1]===id))));}
 return combined.slice(0,count);
}

function startMock(count){
 stopTimer();testSubmitted=false;
 testMode='mock';

 currentQuestions=[];
 sections.forEach((section,si)=>{
  const needed=perSection+(si<remainder?1:0);
  const bank=shuffle(curatedQuestions.filter(row=>row[0]===section));
  const curatedNeeded=Math.min(needed,bank.length);
  currentQuestions.push(...bank.slice(0,curatedNeeded).map(makeBankQuestion));
  const sectionTopics=topics.filter(t=>t.section===section);
  for(let i=curatedNeeded;i<needed;i++){
   const topic=pick(sectionTopics);
   currentQuestions.push(makeQuestion(topic.id));
  }
 });
 currentQuestions=shuffle(currentQuestions);
 lastAnswers=Array(count).fill(-1);
 renderTest();
 window.scrollTo({top:0,behavior:'smooth'});

}

/* One delegated event handler: no inline JavaScript or form submission is required. */
document.addEventListener('click',function(event){
 const button=event.target.closest('button[data-action]');
 if(!button)return;
 const action=button.dataset.action;
 if(action==='topic') startTest(button.dataset.topic,Number(document.getElementById('topicCount')?.value||10));
 else if(action==='mock') startMock(Number(document.getElementById('mockCount')?.value||25));
 else if(action==='home') renderHome();
 else if(action==='submit'){
  captureAnswers();
  submitTest(false);
 }else if(action==='restart'){
  if(testMode==='mock') startMock(currentQuestions.length);
  else startTest(currentTopic.id,currentQuestions.length);
 }
});
document.addEventListener('change',function(event){
 if(event.target.matches('input[type="radio"][name^="q"]')){
  captureAnswers();updateAnsweredCount();
 }
});
renderHome();
</script>
</body>
</html>
